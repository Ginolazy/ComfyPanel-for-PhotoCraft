[package]
name = "comfypanel-photocraft"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
futures-util = "0.3"
image = "0.25.10"
photocraft-core = { git = "https://github.com/Ginolazy/comfypanel-core-private.git" }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "io-util", "time", "process"] }
tokio-tungstenite = "0.24"

# 在 debug 开发模式下强制开启 image 及其依赖的编译优化（达到 release 级毫秒速度，避免 2s 纯 CPU 逐像素缩放慢速）
[profile.dev.package.image]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSPanel", "NSWindow", "NSWorkspace", "NSPasteboard"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory"
] }
